spring:
  application:
    name: ai-fashion-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fit_ai_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in ms

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:123456789}
  api-secret: ${CLOUDINARY_API_SECRET:secret}

fpt:
  ai:
    api:
      key: ${FPT_AI_API_KEY:w16m0PqQkM7JmP9zLg4N5K2V8X3Y0Z1A}
    tts:
      url: ${FPT_AI_TTS_URL:https://api.fpt.ai/hmi/tts/v5}

